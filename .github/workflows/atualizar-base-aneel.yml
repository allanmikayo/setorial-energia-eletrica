name: Atualizar base ANEEL (DEC/FEC)

# Roda só quando você mandar: aba Actions -> este workflow -> "Run workflow".
# Para ligar atualização automática, descomente o bloco schedule abaixo.
# A ANEEL publica mensalmente; dia 10 às 09:00 UTC (06:00 em Brasília) é seguro.
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'De onde ler: arquivo-fonte completo (tem o ano corrente) ou API'
        type: choice
        required: false
        default: 'auto'
        options: ['auto', 'arquivo', 'api']
      anos:
        description: 'Anos a baixar (ex.: 2024,2025) ou "todos" para tudo que a fonte tiver'
        required: false
        default: 'todos'
      indicadores:
        description: 'Indicadores dos apurados, ou "todos" para as parcelas desagregadas'
        required: false
        default: 'DEC,FEC,NumCon'
      csv_plano:
        description: 'Gravar CSV sem gzip (arquivos bem maiores no repo)'
        type: boolean
        required: false
        default: false
  # schedule:
  #   - cron: '0 9 10 * *'

concurrency:
  group: base-aneel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar da ANEEL
        env:
          FONTE: ${{ inputs.fonte || 'auto' }}
          ANOS: ${{ inputs.anos || 'todos' }}
          INDICADORES: ${{ inputs.indicadores || 'DEC,FEC,NumCon' }}
          CSV_PLANO: ${{ inputs.csv_plano }}
        run: |
          # A comparacao com "true" e feita aqui no shell de proposito.
          # Nas expressoes do GitHub, uma entrada booleana chega como a STRING
          # "false", e string nao vazia e verdadeira ali: a forma
          # ${{ inputs.csv_plano && '--csv-plano' || '' }} passaria a flag mesmo
          # com a caixa desmarcada.
          EXTRA=""
          if [ "$CSV_PLANO" = "true" ]; then EXTRA="--csv-plano"; fi
          python scripts/baixar_aneel.py \
            --fonte "$FONTE" \
            --anos "$ANOS" \
            --indicadores "$INDICADORES" \
            $EXTRA

      - name: Commitar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Base inalterada desde a última atualização — nada a commitar."
            echo "Base **inalterada** desde a última atualização." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "dados: base ANEEL de continuidade em $(date -u +%Y-%m-%d)"
          git push
